<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reminder</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1c1e">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Roboto, sans-serif;
    background: #0f0f12; color: #f2f2f2; padding: 24px 20px 40px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.sub { color: #9a9a9f; font-size: 14px; margin-top: 0; }
  .card {
    background: #1c1c1f; border-radius: 16px; padding: 18px;
    margin-top: 20px; border: 1px solid #2a2a2e;
  }
  label { font-size: 13px; color: #b5b5ba; display: block; margin-bottom: 6px; }
  select, input {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333;
    background: #0f0f12; color: #fff; font-size: 15px; margin-bottom: 14px;
  }
  .toggle-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 0;
  }
  .switch { position: relative; width: 48px; height: 28px; }
  .switch input { display: none; }
  .slider {
    position: absolute; inset: 0; background: #3a3a3e; border-radius: 20px;
    cursor: pointer; transition: .2s;
  }
  .slider::before {
    content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px;
    background: white; border-radius: 50%; transition: .2s;
  }
  input:checked + .slider { background: #34c759; }
  input:checked + .slider::before { transform: translateX(20px); }
  button.primary {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    background: #0a84ff; color: white; font-size: 15px; font-weight: 600;
    margin-top: 8px;
  }
  .status { font-size: 13px; color: #8e8e93; margin-top: 14px; text-align: center; }
</style>
</head>
<body>
  <h1>📖 Reminder App</h1>
  <p class="sub">Notifikasi otomatis tiap kamu buka kunci layar, arahkan ke app baca.</p>

  <div class="card">
    <div class="toggle-row">
      <span>Aktifkan Reminder</span>
      <label class="switch">
        <input type="checkbox" id="masterToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="card">
    <div class="toggle-row">
      <span id="batteryStatusText">Optimasi Baterai: memeriksa…</span>
    </div>
    <button type="button" id="batteryBtn" style="width:100%;padding:12px;border-radius:10px;border:1px solid #3a3a3e;background:#2c2c2e;color:#fff;font-size:14px;font-weight:600;margin-top:10px;">
      🔋 Matikan Optimasi Baterai untuk App Ini
    </button>
    <p style="font-size:12px;color:#8e8e93;margin-top:8px;margin-bottom:0;">Wajib supaya Android tidak mematikan reminder ini diam-diam di background.</p>
  </div>

  <div class="card">
    <label>Aplikasi tujuan (yang dibuka saat notif diklik)</label>
    <div id="selectedAppBox" style="padding:12px;border-radius:10px;border:1px solid #333;background:#0f0f12;margin-bottom:10px;font-size:14px;color:#e5e5e5;">
      <span id="selectedAppText">Belum ada aplikasi dipilih</span>
    </div>
    <button type="button" id="pickAppBtn" style="width:100%;padding:12px;border-radius:10px;border:1px solid #3a3a3e;background:#2c2c2e;color:#fff;font-size:14px;font-weight:600;margin-bottom:10px;">
      📱 Pilih Aplikasi dari HP
    </button>

    <button type="button" id="toggleWebsiteBtn" style="width:100%;padding:12px;border-radius:10px;border:1px solid #3a3a3e;background:#2c2c2e;color:#fff;font-size:14px;font-weight:600;margin-bottom:14px;">
      🌐 Aplikasi Lainnya / Other (Buka Website)
    </button>

    <div id="websiteSection" style="display:none;margin-bottom:14px;">
      <label for="websiteUrl">Alamat Website</label>
      <input type="url" id="websiteUrl" placeholder="https://contoh.com/baca-buku">

      <div id="selectedBrowserBox" style="padding:12px;border-radius:10px;border:1px solid #333;background:#0f0f12;margin-bottom:10px;font-size:14px;color:#e5e5e5;">
        <span id="selectedBrowserText">Belum pilih browser</span>
      </div>
      <button type="button" id="pickBrowserBtn" style="width:100%;padding:12px;border-radius:10px;border:1px solid #3a3a3e;background:#2c2c2e;color:#fff;font-size:14px;font-weight:600;">
        🌏 Pilih Browser
      </button>
    </div>

    <label for="notifTitle">Judul notifikasi</label>
    <input type="text" id="notifTitle" value="Waktunya fokus baca 📚">

    <label for="notifBody">Isi pesan</label>
    <input type="text" id="notifBody" value="Ketuk untuk lanjut baca bukumu">
  </div>

  <button class="primary" id="saveBtn">Simpan Pengaturan</button>
  <p class="status" id="statusText">Status: memuat…</p>

  <script src="app.js"></script>
</body>
</html>
