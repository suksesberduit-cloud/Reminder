name: Build Reminder APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Setup JDK
        uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Extract project zip
        run: |
          unzip -o reminder-app.zip
          cp -r reminder-app/www .
          cp -r reminder-app/android-native .

      - name: Init npm project + install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6 @capacitor/cli@6

      - name: Init Capacitor project
        run: npx cap init "Reminder" "i
